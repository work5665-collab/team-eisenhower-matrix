<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커맨드 센터</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --border: #475569;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background-color: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-weight: 800; font-size: 1.1rem; color: var(--primary); letter-spacing: 0.5px; }

        nav { display: flex; gap: 6px; }
        .nav-tab {
            background: transparent; border: none; color: var(--text-sub); padding: 8px 14px;
            font-size: 0.85rem; font-weight: 700; border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
        }
        .nav-tab.active { background-color: var(--primary); color: #fff; }

        main { flex: 1; padding: 1.5rem; max-width: 1400px; width: 100%; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 등록 폼 */
        .form-box {
            background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 2rem; line-height: 2.2; font-size: 1rem; font-weight: 600;
        }
        .inline-field {
            background-color: var(--surface-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 6px 10px; border-radius: 6px; font-weight: bold; outline: none; margin: 0 4px;
        }
        .btn-submit {
            width: 100%; margin-top: 1.5rem; padding: 12px; background-color: var(--primary);
            color: white; border: none; border-radius: var(--radius); font-weight: bold; font-size: 1rem; cursor: pointer;
        }

        /* 칸반 / 매트릭스 그리드 */
        .kanban-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; min-height: 600px; }
        .matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; min-height: 600px; }

        @media (max-width: 900px) {
            .kanban-grid, .matrix-grid { grid-template-columns: 1fr; }
        }

        /* 드롭 칼럼 레아아웃 (트렐로 스타일) */
        .column {
            background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            display: flex; flex-direction: column; padding: 1rem; max-height: 75vh;
        }
        .column-header { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .column-count { background: var(--surface-card); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }

        /* 드롭 영역 */
        .card-container {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding: 4px; min-height: 150px;
        }
        .card-container.drag-over { background-color: rgba(59, 130, 246, 0.15); border-radius: var(--radius); }

        /* 트렐로/젠키트 스타일 카드 */
        .card {
            background-color: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 0.85rem; cursor: grab; user-select: none; transition: transform 0.15s, box-shadow 0.15s;
            display: flex; flex-direction: column; gap: 6px;
        }
        .card:active { cursor: grabbing; }
        .card.dragging { opacity: 0.4; transform: scale(0.98); }

        .card-badge {
            align-self: flex-start; background: var(--primary); color: white;
            font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;
        }
        .card-title { font-size: 0.9rem; font-weight: 700; line-height: 1.4; color: var(--text-main); }
        .card-meta { font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; margin-top: 4px; }

        /* 팀원 부하 & 피드백 */
        .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
        .progress-bg { background: var(--surface-card); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-fill { background: var(--accent); height: 100%; transition: width 0.3s; }
        
        .kpt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .kpt-grid textarea {
            width: 100%; height: 60px; background: var(--surface-card); border: 1px solid var(--border);
            color: var(--text-main); padding: 6px; border-radius: 4px; resize: none; font-size: 0.8rem; outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ COMMAND CENTER</div>
        <nav>
            <button class="nav-tab active" onclick="switchTab('tab-1')">1. 등록</button>
            <button class="nav-tab" onclick="switchTab('tab-2')">2. 아이젠하워</button>
            <button class="nav-tab" onclick="switchTab('tab-3')">3. 칸반 보드</button>
            <button class="nav-tab" onclick="switchTab('tab-4')">4. 업무 부하</button>
            <button class="nav-tab" onclick="switchTab('tab-5')">5. 추적 & KPT</button>
        </nav>
    </header>

    <main>
        <!-- TAB 1: 업무 등록 -->
        <div id="tab-1" class="tab-content active">
            <h2 style="margin-bottom:1rem;">✍️ 문장 완결형 업무 등록</h2>
            <div class="form-box">
                <input type="text" id="in-who" class="inline-field" placeholder="담당자 (예: 김촬영)" value="김촬영"> 이(가)
                <input type="text" id="in-type" class="inline-field" placeholder="업무 내용 (예: 영상 편집)" value="영상 편집"> 을(를)
                <select id="in-how" class="inline-field">
                    <option value="직접 실행">직접 실행</option>
                    <option value="1:1 교육전수">1:1 교육전수</option>
                    <option value="외부 위임">외부 위임</option>
                    <option value="시스템 자동화">시스템 자동화</option>
                </select> 방식으로
                <input type="date" id="in-date" class="inline-field"> 까지
                <input type="text" id="in-space" class="inline-field" placeholder="장소" value="스튜디오"> 에서
                <input type="text" id="in-target" class="inline-field" placeholder="관련자" value="이조연출"> 와(과) 함께
                <input type="text" id="in-result" class="inline-field" placeholder="목표 결과물" value="최종본 제출"> 을(를) 완료한다.
                <button class="btn-submit" onclick="addCard()">🚀 등록 및 보드 반영</button>
            </div>
        </div>

        <!-- TAB 2: 아이젠하워 매트릭스 -->
        <div id="tab-2" class="tab-content">
            <h2 style="margin-bottom:1rem;">🎯 아이젠하워 매트릭스</h2>
            <div class="matrix-grid">
                <div class="column">
                    <div class="column-header">🔥 1사분면 (긴급/중요)<span class="column-count" id="cnt-Q1">0</span></div>
                    <div class="card-container" id="Q1" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'matrix', 'Q1')"></div>
                </div>
                <div class="column">
                    <div class="column-header">🎯 2사분면 (계획/시스템)<span class="column-count" id="cnt-Q2">0</span></div>
                    <div class="card-container" id="Q2" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'matrix', 'Q2')"></div>
                </div>
                <div class="column">
                    <div class="column-header">🤝 3사분면 (위임/지원)<span class="column-count" id="cnt-Q3">0</span></div>
                    <div class="card-container" id="Q3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'matrix', 'Q3')"></div>
                </div>
                <div class="column">
                    <div class="column-header">🧹 4사분면 (정리/최소화)<span class="column-count" id="cnt-Q4">0</span></div>
                    <div class="card-container" id="Q4" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'matrix', 'Q4')"></div>
                </div>
            </div>
        </div>

        <!-- TAB 3: 칸반 보드 -->
        <div id="tab-3" class="tab-content">
            <h2 style="margin-bottom:1rem;">📋 업무 진행 칸반 보드</h2>
            <div class="kanban-grid">
                <div class="column">
                    <div class="column-header">📝 대기 (To Do)<span class="column-count" id="cnt-todo">0</span></div>
                    <div class="card-container" id="todo" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'kanban', 'todo')"></div>
                </div>
                <div class="column">
                    <div class="column-header">🔥 진행 중 (In Progress)<span class="column-count" id="cnt-ing">0</span></div>
                    <div class="card-container" id="ing" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'kanban', 'ing')"></div>
                </div>
                <div class="column">
                    <div class="column-header">👀 점검 (Review)<span class="column-count" id="cnt-check">0</span></div>
                    <div class="card-container" id="check" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'kanban', 'check')"></div>
                </div>
                <div class="column">
                    <div class="column-header">✅ 완료 (Done)<span class="column-count" id="cnt-done">0</span></div>
                    <div class="card-container" id="done" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'kanban', 'done')"></div>
                </div>
            </div>
        </div>

        <!-- TAB 4: 팀원 부하 -->
        <div id="tab-4" class="tab-content">
            <h2 style="margin-bottom:1rem;">📊 팀원별 업무 부하 지수</h2>
            <div id="load-container"></div>
        </div>

        <!-- TAB 5: KPT 피드백 -->
        <div id="tab-5" class="tab-content">
            <h2 style="margin-bottom:1rem;">🔍 KPT 회고 & 반복 추적</h2>
            <div id="kpt-container"></div>
        </div>
    </main>

    <script>
        // 데이터 상태 관리
        let state = {
            cards: []
        };

        let draggedCardId = null;

        // 오늘 날짜 세팅
        document.getElementById('in-date').value = new Date().toISOString().split('T')[0];

        // 탭 전환
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            const btnIdx = parseInt(tabId.split('-')[1]) - 1;
            document.querySelectorAll('.nav-tab')[btnIdx].classList.add('active');
            
            render();
        }

        // 새 카드 등록
        function addCard() {
            const who = document.getElementById('in-who').value || '담당자';
            const type = document.getElementById('in-type').value || '업무';
            const how = document.getElementById('in-how').value;
            const date = document.getElementById('in-date').value;
            const space = document.getElementById('in-space').value || '장소';
            const target = document.getElementById('in-target').value || '없음';
            const result = document.getElementById('in-result').value || '결과물';

            let matrix = 'Q1';
            if (how === '1:1 교육전수' || how === '시스템 자동화') matrix = 'Q2';
            else if (how === '외부 위임') matrix = 'Q3';

            const newCard = {
                id: 'card-' + Date.now(),
                who, type, how, date, space, target, result,
                title: `${who}이(가) ${type}을(를) ${how} 방식으로 ${result}을(를) 완료함`,
                matrix: matrix,
                kanban: 'todo',
                kpt: { k: '', p: '', t: '' }
            };

            state.cards.push(newCard);
            alert('새 카드가 등록되었습니다!');
            switchTab('tab-3');
        }

        // Native Drag and Drop 이벤트 핸들러
        function handleDragStart(e, id) {
            draggedCardId = id;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', id);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.card-container').forEach(c => c.classList.remove('drag-over'));
        }

        function allowDrop(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function handleDrop(e, groupType, targetCategory) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            if (!draggedCardId) return;

            const card = state.cards.find(c => c.id === draggedCardId);
            if (card) {
                if (groupType === 'matrix') {
                    card.matrix = targetCategory;
                } else if (groupType === 'kanban') {
                    card.kanban = targetCategory;
                }
            }
            draggedCardId = null;
            render();
        }

        // 화면 랜더링 함수
        function render() {
            renderMatrix();
            renderKanban();
            renderLoad();
            renderKpt();
        }

        // HTML 카드 생성 헬퍼
        function createCardElement(card, badgeText) {
            return `
                <div class="card" draggable="true" id="${card.id}" 
                     ondragstart="handleDragStart(event, '${card.id}')" 
                     ondragend="handleDragEnd(event)">
                    <span class="card-badge">${badgeText}</span>
                    <div class="card-title">${card.title}</div>
                    <div class="card-meta">
                        <span>👤 ${card.who}</span>
                        <span>📅 ${card.date}</span>
                    </div>
                </div>
            `;
        }

        function renderMatrix() {
            ['Q1', 'Q2', 'Q3', 'Q4'].forEach(q => {
                const container = document.getElementById(q);
                const list = state.cards.filter(c => c.matrix === q);
                document.getElementById(`cnt-${q}`).innerText = list.length;
                container.innerHTML = list.map(c => createCardElement(c, `${c.kanban.toUpperCase()}`)).join('');
            });
        }

        function renderKanban() {
            ['todo', 'ing', 'check', 'done'].forEach(k => {
                const container = document.getElementById(k);
                const list = state.cards.filter(c => c.kanban === k);
                document.getElementById(`cnt-${k}`).innerText = list.length;
                container.innerHTML = list.map(c => createCardElement(c, `${c.matrix}`)).join('');
            });
        }

        function renderLoad() {
            const container = document.getElementById('load-container');
            const members = [...new Set(state.cards.map(c => c.who))];
            
            if (members.length === 0) {
                container.innerHTML = `<div style="color:var(--text-sub);">등록된 업무가 없습니다.</div>`;
                return;
            }

            container.innerHTML = members.map(m => {
                const mCards = state.cards.filter(c => c.who === m);
                const load = Math.min(mCards.length * 25, 100);
                return `
                    <div class="panel-box">
                        <div style="display:flex; justify-style:space-between; justify-content:space-between;">
                            <strong>👤 ${m}</strong>
                            <span style="color:var(--primary); font-weight:bold;">부하 지수 ${load}%</span>
                        </div>
                        <div class="progress-bg"><div class="progress-fill" style="width:${load}%;"></div></div>
                        <div style="font-size:0.8rem; color:var(--text-sub); margin-top:6px;">총 ${mCards.length}개의 업무 담당 중</div>
                    </div>
                `;
            }).join('');
        }

        function renderKpt() {
            const container = document.getElementById('kpt-container');
            if (state.cards.length === 0) {
                container.innerHTML = `<div style="color:var(--text-sub);">등록된 업무가 없습니다.</div>`;
                return;
            }

            container.innerHTML = state.cards.map(c => `
                <div class="panel-box">
                    <div style="font-weight:bold; font-size:0.9rem; margin-bottom:4px;">${c.title}</div>
                    <div style="font-size:0.75rem; color:var(--text-sub); margin-bottom:8px;">위치: ${c.matrix} / 상태: ${c.kanban.toUpperCase()}</div>
                    <div class="kpt-grid">
                        <div>
                            <span style="font-size:0.75rem; color:#10b981; font-weight:bold;">Keep</span>
                            <textarea onchange="updateKpt('${c.id}', 'k', this.value)" placeholder="지속할 점">${c.kpt.k}</textarea>
                        </div>
                        <div>
                            <span style="font-size:0.75rem; color:#ef4444; font-weight:bold;">Problem</span>
                            <textarea onchange="updateKpt('${c.id}', 'p', this.value)" placeholder="문제점">${c.kpt.p}</textarea>
                        </div>
                        <div>
                            <span style="font-size:0.75rem; color:#3b82f6; font-weight:bold;">Try</span>
                            <textarea onchange="updateKpt('${c.id}', 't', this.value)" placeholder="시도할 점">${c.kpt.t}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateKpt(id, key, val) {
            const card = state.cards.find(c => c.id === id);
            if (card) card.kpt[key] = val;
        }

        // 초기 랜더링
        render();
    </script>
</body>
</html>
